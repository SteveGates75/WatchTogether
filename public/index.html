<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Call & Screen Share</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <h2>✨ Welcome</h2>
        <input type="text" id="username" placeholder="Your name">
        <button onclick="login()">Join</button>
    </div>

    <div id="app-container" style="display: none;">
        <div class="sidebar">
            <h3>⚡ Online</h3>
            <div id="users-list"></div>
            <div class="call-controls">
                <button class="btn" id="videoCallBtn" onclick="toggleVideoCall()">📹 Video Call</button>
                <button class="btn" id="audioCallBtn" onclick="toggleAudioCall()">🎧 Audio Call</button>
                <button class="btn" id="screenShareBtn" onclick="toggleScreenShare()">📺 Share Screen</button>
                <button class="btn" id="muteAudioBtn" onclick="toggleMuteAudio()" disabled>🔊 Mute Mic</button>
                <button class="btn" id="muteVideoBtn" onclick="toggleMuteVideo()" disabled>🎥 Hide Video</button>
                <button class="btn" id="switchCameraBtn" onclick="switchCamera()" disabled>📷 Switch</button>
                <button class="btn-primary" onclick="copyInviteLink()">🔗 Copy Link</button>
                <button class="btn-danger" onclick="hangUp()">📴 Hang Up</button>
            </div>
        </div>

        <div class="main-content">
            <div class="video-grid">
                <div class="video-box placeholder" id="localPlaceholder">
                    <div class="placeholder-content">You</div>
                    <video id="localVideo" autoplay playsinline muted style="display: none;"></video>
                    <span class="mute-indicator" id="localMuteIndicator">🔇 Muted</span>
                </div>
                <div class="video-box placeholder" id="remotePlaceholder">
                    <div class="placeholder-content">Remote</div>
                    <video id="remoteVideo" autoplay playsinline style="display: none;"></video>
                    <button class="fullscreen-btn" onclick="toggleFullscreen()" style="display: none;">⛶ Full</button>
                </div>
            </div>

            <div id="status-bar">
                <span id="status">Not in a call</span>
                <span id="quality-indicator" class="quality-badge"></span>
            </div>

            <div class="chat-container">
                <div id="messages"></div>
                <div class="message-input">
                    <input type="text" id="chat-input" placeholder="Type a message...">
                    <button onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="incoming-call">
        <span id="callerName">Someone</span> is calling
        <button onclick="acceptCall()">Accept</button>
        <button onclick="rejectCall()">Reject</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
